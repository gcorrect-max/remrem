<!DOCTYPE html>		
<html>
	<head>
		<!-- META tag -->
		<meta charset="UTF-8" />
		<meta name="author" content="HaslerRail">
		<title> Calibration </title>
		
		<!-- Style sheet
		<link rel="stylesheet" type="text/css" href="Style/table.css" /> -->
		<link rel="stylesheet" type="text/css" href="Style/calibration.css" />
		
		<!-- Script -->
		<script type="text/javascript" src="Script/canvasloader-min.js"></script>
		<script type="text/javascript" src="Script/jquery.js"></script>
		<script type="text/javascript" src="Script/jquery.cookie.js"></script>
		<script type="text/javascript" src="Script/globalFunc.js"></script>		
		<script type="text/javascript" src="Script/calibration.js"></script>		
	</head>
	<body id="iframe">	
		<div id="cal_container" >
			<h1></h1>
			<h2></h2>
			<form id="setData" >
				<div id="Sequence">
					<div class="div">
						<a onClick="Offset('1','A')">Chanel A Offset</a> 
					</div>
					<div class="div">
						<a onClick="Offset('2','B')" >Chanel B Offset</a> 
					</div>
					<div style="clear:both"></div>
					<div class="div">
						<a onClick="Gain('3','A')" >Chanel A Gain</a> 
					</div>
					<div class="div">
						<a onClick="Gain('4','B')" >Chanel B Gain</a> 
					</div>					
				</div>
				<div id="query_combination"></div>
				<div id="text_result"></div>
				<div id="output"></div>
				<br>
				<div id="execution"></div>
				<div id="foot"></div>
				<div id="result"><h1></h1></div>
			</form>			
		</div>
	</body>
</html>
